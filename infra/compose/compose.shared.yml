name: ${PROJECT}

services:

  # region Storages
  db:
    container_name: ${PROJECT}-db
    image: postgres:16
    restart: unless-stopped
    command: [ 
        'postgres', 
        '-c', 
        'shared_preload_libraries=pg_stat_statements',
        '-c',
        'shared_buffers=2GB', # Set memory for shared buffers
        '-c',
        'work_mem=64MB', # Memory for sorting/hash joins per operation
        '-c',
        'maintenance_work_mem=512MB', # Memory for maintenance operations
        '-c',
        'effective_cache_size=6GB', # Anticipated OS disk cache
        '-c',
        'max_connections=30', # Limit max client connections
        '-c',
        'wal_buffers=16MB', # Increase write-ahead log (WAL) buffers
        '-c',
        'min_wal_size=1GB', # Minimum size of WAL files
        '-c',
        'max_wal_size=4GB', # Maximum size of WAL files
        '-c',
        'checkpoint_completion_target=0.7', # Spread checkpoints over time
        '-c',
        'autovacuum_vacuum_scale_factor=0.1', # Scale factor for vacuuming. 0.05-0.1 for tables with heavy write activity to trigger autovacuum earlier and avoid table bloat.
        '-c',
        'autovacuum_analyze_scale_factor=0.05', # Scale factor for analyzing. 0.05-0.1 so ANALYZE runs more frequently on tables with many tuple changes, ensuring up-to-date table statistics for the query planner.
        '-c',
        'autovacuum_vacuum_cost_limit=1000', # Cost limit for vacuuming. 1000-2000 to allow autovacuum processes to perform more work in each cycle on larger tables.
        '-c',
        'autovacuum_work_mem=512MB', # Memory for autovacuum processes, Explicitly set it to 256MB or 512MB, especially for large tables that are vacuumed frequently.
        '-c',
        'random_page_cost=1.1', # Set the cost of a non-sequentially fetched disk page to 1.1, which is a good starting point for SSDs.
        '-c',
        'effective_io_concurrency=32', # Increase if using modern SSD storage to 32 or 64 (depends on the number of concurrent I/O operations your disk subsystem can handle).
        '-c',
        'fsync=on', # Ensures data durability
        '-c',
        'synchronous_commit=on', # Balance between durability and speed
      ]
    deploy:
      resources:
        limits:
          cpus: '${DB_CPU_LIMIT}'
          memory: '${DB_MEM_LIMIT}'
    volumes:
      - ../../.volumes/postgres:/var/lib/postgresql/data:Z
    environment:
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PGUSER=${DB_USER}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
    ports:
      # Left side of the mapping, host address included. Default: this machine only. Never publish
      # Postgres on 0.0.0.0; set DB_HOST_PORT=127.0.0.1:<port> to pick the host port.
      - ${DB_HOST_PORT:-127.0.0.1:${DB_PORT}}:5432
    healthcheck:
      # Over TCP: initdb's temporary server listens on the socket only, answers ready, then shuts
      # down, and `migrate` (never restarted) would fail on that first boot.
      test: [ 'CMD', 'pg_isready', '-h', '127.0.0.1', '-d', '${DB_NAME}', '-U', '${DB_USER}' ]
    security_opt:
      - no-new-privileges:true

  kv:
    container_name: ${PROJECT}-kv
    image: valkey/valkey:8.1
    restart: unless-stopped
    volumes:
      - ../../.volumes/kv:/data:Z
    ports:
      # As for Postgres: this machine only by default, and Valkey needs KV_PASSWORD besides.
      - ${KV_HOST_PORT:-127.0.0.1:${KV_PORT}}:6379
    # The password reaches Valkey through the environment and is expanded by the shell inside the
    # container ($$ stops Compose expanding it), so it is not in the command line that
    # `docker inspect` prints under Config.Cmd. The command goes through the image's own
    # `docker-entrypoint.sh`: it drops root to the `valkey` user only when its first argument is
    # `valkey-server`, which a bare `sh -c` would skip (Valkey would run as root). `docker inspect`
    # still shows Config.Env, like every other secret in this file; `valkey-cli` reads the same
    # value from REDISCLI_AUTH.
    environment:
      - KV_PASSWORD=${KV_PASSWORD:?KV_PASSWORD is required, Valkey will not start without it}
      - REDISCLI_AUTH=${KV_PASSWORD}
    command:
      - sh
      - -c
      - >-
        exec docker-entrypoint.sh valkey-server
        --requirepass "$$KV_PASSWORD"
        --maxmemory ${KV_MEM_INNER_LIMIT}
        --maxmemory-policy allkeys-lru
        --save ""
    deploy:
      resources:
        limits:
          cpus: ${KV_CPU_LIMIT}
          memory: '${KV_MEM_LIMIT}'
    healthcheck:
      test: [ 'CMD', 'valkey-cli', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  minio:
    container_name: ${PROJECT}-minio
    # `pgsty/minio` and `pgsty/mc` are the community fork that keeps building MinIO: upstream's
    # `minio/minio` and `minio/mc` refuse anonymous pulls. Same binaries, commands and env names.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /data/loki-data && \
        mkdir -p /data/loki-ruler && \
        minio server --console-address ":9001" /data
    environment:
      - MINIO_ROOT_USER=${MINIO_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_PASS}
      - MINIO_PROMETHEUS_AUTH_TYPE=public
    volumes:
      - ../../.volumes/minio:/data:Z
    healthcheck:
      test: [ 'CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live' ]
      interval: 15s
      timeout: 20s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: ${MINIO_CPU_LIMIT}
          memory: '${MINIO_MEM_LIMIT}'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.minio-${PROJECT}.rule=Host(`minio.${DOMAIN}`)'
      - 'traefik.http.routers.minio-${PROJECT}.entrypoints=web'
      - 'traefik.http.services.minio-${PROJECT}.loadbalancer.server.port=9001'

  minio-configure:
    container_name: ${PROJECT}-minio-configure
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      - minio
    volumes:
      - ../../infra:/infra:z
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 ${MINIO_USER} ${MINIO_PASS}); do
        echo 'Waiting for MinIO...'; sleep 3;
      done;
      /usr/bin/mc ilm import myminio/loki-data < /infra/configs/loki-data-minio-lifecycle.json;
      "
  # endregion Storages

  # region Monitoring
  loki:
    container_name: ${PROJECT}-loki
    image: grafana/loki:3.7.8
    restart: unless-stopped
    volumes:
      - ../../infra/configs/loki.yml:/etc/loki/config.yaml:ro,Z
    environment:
      - S3_ACCESS_KEY_ID=${MINIO_USER}
      - S3_SECRET_ACCESS_KEY=${MINIO_PASS}
    depends_on:
      - minio
    command:
      - '-config.file=/etc/loki/config.yaml'
      - '-config.expand-env=true'
    # No healthcheck: the Loki 3 image has no shell, wget or health subcommand, so any check
    # reports unhealthy forever. No service waits on Loki being healthy.
    deploy:
      resources:
        limits:
          cpus: ${LOKI_CPU_LIMIT}
          memory: '${LOKI_MEM_LIMIT}'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # promtail, nodeexporter and cadvisor watch the whole host (every container's logs, the host's
  # CPU, disk and network). On a shared server that duplicates the host's own monitoring, so they
  # start only with the `host-monitoring` profile: set COMPOSE_PROFILES=host-monitoring in the env
  # file. Prometheus still lists their scrape jobs and shows them as down while they are off.
  promtail:
    container_name: ${PROJECT}-promtail
    profiles: [host-monitoring]
    restart: unless-stopped
    image: grafana/promtail:2.9.2
    volumes:
      - /var/log:/var/log
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../infra/configs/promtail.yml:/etc/promtail/config.yaml:ro
    security_opt:
      - label=disable
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          cpus: ${PROMTAIL_CPU_LIMIT}
          memory: '${PROMTAIL_MEM_LIMIT}'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  prometheus:
    container_name: ${PROJECT}-prometheus
    image: prom/prometheus:v3.15.0
    user: root
    restart: unless-stopped
    volumes:
      - ../../infra/configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - ../../.volumes/prometheus:/prometheus:Z
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--web.external-url=https://prometheus.${DOMAIN}'
      - '--web.route-prefix=/'
    deploy:
      resources:
        limits:
          cpus: ${PROMETHEUS_CPU_LIMIT}
          memory: '${PROMETHEUS_MEM_LIMIT}'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  postgres-prometheus-exporter:
    container_name: ${PROJECT}-postgres-prometheus-exporter
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_NAME: 'postgresql://${DB_USER}:${DB_PASS}@db:5432/${DB_NAME}?sslmode=disable'
    deploy:
      resources:
        limits:
          cpus: ${POSTGRES_EXPORTER_CPU_LIMIT}
          memory: '${POSTGRES_EXPORTER_MEM_LIMIT}'
    depends_on:
      - db

  grafana:
    container_name: ${PROJECT}-grafana
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    user: '0'
    volumes:
      - ../../.volumes/grafana:/var/lib/grafana:Z
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASS}
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN}
    deploy:
      resources:
        limits:
          cpus: ${GRAFANA_CPU_LIMIT}
          memory: '${GRAFANA_MEM_LIMIT}'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.grafana-${PROJECT}.rule=Host(`grafana.${DOMAIN}`)'
      - 'traefik.http.routers.grafana-${PROJECT}.entrypoints=web'
      - 'traefik.http.services.grafana-${PROJECT}.loadbalancer.server.port=3000'

  nodeexporter:
    container_name: ${PROJECT}-nodeexporter
    profiles: [host-monitoring]
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.textfile.directory=/etc/node-exporter'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    deploy:
      resources:
        limits:
          cpus: ${NODEEXPORTER_CPU_LIMIT}
          memory: '${NODEEXPORTER_MEM_LIMIT}'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  cadvisor:
    container_name: ${PROJECT}-cadvisor
    profiles: [host-monitoring]
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    deploy:
      resources:
        limits:
          cpus: ${CADVISOR_CPU_LIMIT}
          memory: '${CADVISOR_MEM_LIMIT}'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
  # endregion Monitoring

  # region Apps
  # Base image with Deno and dependencies pre-installed for caching
  deno-base:
    container_name: ${PROJECT}-deno-base
    image: app/deno-base:${DENO_VERSION}
    build:
      context: ../..
      dockerfile: Dockerfile.base
      args:
        - DENO_VERSION=${DENO_VERSION}
    profiles:
      - donotstart

  # Applies pending migrations, then exits. The API and the worker start only after it exits with 0,
  # so a deploy never serves traffic on the old schema, and a failed migration stops `compose up`
  # (and so `deno task deploy`) instead of starting an API whose queries fail. The runner in
  # @spy4x/server/db locks and checksums, so it runs on every `up`: with nothing pending it changes
  # nothing. Same build as the API; migration files come from the bind-mounted libs.
  migrate:
    container_name: ${PROJECT}-migrate
    restart: "no"
    build:
      context: ../..
      dockerfile: apps/api/dockerfile
      args:
        - DENO_VERSION=${DENO_VERSION}
    command: [ 'deno', 'task', 'db:migrate' ]
    deploy:
      resources:
        limits:
          # Defaults, so an env file written before this service existed still deploys.
          cpus: '${MIGRATE_CPU_LIMIT:-0.5}'
          memory: '${MIGRATE_MEM_LIMIT:-256M}'
    volumes:
      - ../../apps:/app/apps:z
      - ../../libs:/app/libs:z
      - ../../deno.jsonc:/app/deno.jsonc:z
    user: "1000:1000"
    environment:
      - HOME=/home/deno
      - DENO_DIR=/tmp/deno-cache
      - DENO_LOG=${DENO_LOG}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  api:
    container_name: ${PROJECT}-api
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: apps/api/dockerfile
      args:
        - DENO_VERSION=${DENO_VERSION}
    volumes:
      - ../../apps:/app/apps:z
      - ../../libs:/app/libs:z
      - ../../deno.jsonc:/app/deno.jsonc:z
      # Long form so a missing file fails the start with an error instead of Docker creating an
      # empty directory there. `deno task deploy` generates the file on the server.
      - type: bind
        source: ../../infra/configs/vapid.json
        target: /app/vapid.json
        bind:
          create_host_path: false
          selinux: Z
    user: "1000:1000"
    environment:
      - HOME=/home/deno
      - ENV=${ENV}
      - ERROR_REPORT_DSN=${ERROR_REPORT_DSN:-}
      - DENO_DIR=/tmp/deno-cache
      - DENO_LOG=${DENO_LOG}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - AUTH_COOKIE_SECRET=${AUTH_COOKIE_SECRET}
      - AUTH_PEPPER=${AUTH_PEPPER}
      - AUTH_TOTP=${AUTH_TOTP}
      - DEV_EMAIL=${DEV_EMAIL}
      - DOMAIN=${DOMAIN}
      - TIMEZONE=${TIMEZONE}
      - KV_HOSTNAME=kv
      - KV_PORT=6379
      - KV_PASSWORD=${KV_PASSWORD:?KV_PASSWORD is required}
      - RATE_LIMITER_WINDOW_MS=${RATE_LIMITER_WINDOW_MS}
      - RATE_LIMITER_STRICT_LIMIT=${RATE_LIMITER_STRICT_LIMIT}
      - RATE_LIMITER_LIMIT=${RATE_LIMITER_LIMIT}
      - RATE_LIMITER_OTP_WINDOW_MS=${RATE_LIMITER_OTP_WINDOW_MS}
      - RATE_LIMITER_OTP_LIMIT=${RATE_LIMITER_OTP_LIMIT}
      # Mail. Production sends nothing until all five are set; see infra/envs/.env.example.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # Billing. Unset → off in production; see docs/billing.md.
      - BILLING_PROVIDER=${BILLING_PROVIDER:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_PRO=${STRIPE_PRICE_PRO:-}
      - BILLING_GRACE_DAYS=${BILLING_GRACE_DAYS:-}
      - BILLING_TRIAL_REQUIRES_CARD=${BILLING_TRIAL_REQUIRES_CARD:-}
      # Mail subscriptions: the API checks the links the worker signs. Unset → off in production.
      - SUBSCRIBERS_SECRET=${SUBSCRIBERS_SECRET:-}
      - SUBSCRIBERS_PREVIOUS_SECRETS=${SUBSCRIBERS_PREVIOUS_SECRETS:-}
    deploy:
      resources:
        limits:
          cpus: '${API_CPU_LIMIT}'
          memory: '${API_MEM_LIMIT}'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [ 'CMD', 'wget', '--spider', 'http://127.0.0.1:${API_PORT}/api/health' ]
      interval: 10s
      timeout: 5s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.api-${PROJECT}.rule=Host(`${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/ws`))'
      - 'traefik.http.routers.api-${PROJECT}.entrypoints=web'
      - 'traefik.http.routers.api-${PROJECT}.service=api-${PROJECT}'
      - 'traefik.http.services.api-${PROJECT}.loadbalancer.server.port=${API_PORT}'
      - 'traefik.docker.network=proxy'
      # `requestInfoFromContext(c, { trustedProxy: true })` (apps/api) reads CF-Connecting-IP
      # first. Traefik does not set that header itself and passes through whatever the client
      # sent — unlike X-Forwarded-For/X-Real-IP, which Traefik overwrites — so a client could
      # otherwise pick the IP written to auth_audits. This middleware strips it before the
      # request reaches the app; an empty `customrequestheaders` value removes the header.
      - 'traefik.http.middlewares.strip-cf-ip-${PROJECT}.headers.customrequestheaders.CF-Connecting-IP='
      - 'traefik.http.routers.api-${PROJECT}.middlewares=strip-cf-ip-${PROJECT}'
    networks:
      - default
      - proxy

  # Drains outbox_events, announces committed group changes to the API (pg_notify, which the API
  # turns into a live hint for other tabs) and sweeps expired idempotency keys. Same build as the
  # API, so both run one image; only the command differs. No port: nothing connects to it.
  # Connections: the worker's pool (max 10) plus the API's (max 10, plus one LISTEN connection)
  # plus postgres-exporter stay under the db's max_connections=30.
  worker:
    container_name: ${PROJECT}-worker
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: apps/api/dockerfile
      args:
        - DENO_VERSION=${DENO_VERSION}
    command: [ 'deno', 'run', '--allow-sys', '--allow-env', '--allow-net', 'apps/worker/+main.ts' ]
    volumes:
      - ../../apps:/app/apps:z
      - ../../libs:/app/libs:z
      - ../../deno.jsonc:/app/deno.jsonc:z
    user: "1000:1000"
    environment:
      - HOME=/home/deno
      - ENV=${ENV}
      - DOMAIN=${DOMAIN}
      - DENO_DIR=/tmp/deno-cache
      - DENO_LOG=${DENO_LOG}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      # Mail. Production sends nothing until all five are set; see infra/envs/.env.example.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # Billing: the worker changes a per-member subscription's quantity. The same setup as the
      # API's, without the webhook secret: only the API verifies webhooks. See docs/billing.md.
      - BILLING_PROVIDER=${BILLING_PROVIDER:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PRICE_PRO=${STRIPE_PRICE_PRO:-}
      - BILLING_GRACE_DAYS=${BILLING_GRACE_DAYS:-}
      - BILLING_TRIAL_REQUIRES_CARD=${BILLING_TRIAL_REQUIRES_CARD:-}
      # Mail subscriptions: the API checks the links the worker signs. Unset → off in production.
      - SUBSCRIBERS_SECRET=${SUBSCRIBERS_SECRET:-}
      - SUBSCRIBERS_PREVIOUS_SECRETS=${SUBSCRIBERS_PREVIOUS_SECRETS:-}
    deploy:
      resources:
        limits:
          # Defaults, so an env file written before the worker existed still deploys.
          cpus: '${WORKER_CPU_LIMIT:-0.5}'
          memory: '${WORKER_MEM_LIMIT:-256M}'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  spa:
    container_name: ${PROJECT}-spa
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: apps/spa/dockerfile.prod
      args:
        - DENO_VERSION=${DENO_VERSION}
    environment:
      - DENO_DIR=/tmp/deno-cache
      - DENO_LOG=${DENO_LOG}
      - VITE_ENV=prod
      # Read at container start into /config.json (apps/spa/public-env.allow lists them all).
      - SPA_ENV=${ENV}
      - SPA_ERROR_REPORT_DSN=${SPA_ERROR_REPORT_DSN:-}
      - SPA_REALTIME=${SPA_REALTIME:-}
      - SPA_OFFLINE=${SPA_OFFLINE:-}
    volumes:
      - ../../apps:/app/apps:z
      - ../../libs:/app/libs:z
      - ../../deno.jsonc:/app/deno.jsonc:z
    user: "1000:1000"
    deploy:
      resources:
        limits:
          cpus: ${SPA_CPU_LIMIT}
          memory: "${SPA_MEM_LIMIT}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      api:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.spa-${PROJECT}.rule=Host(`${DOMAIN}`) && !PathPrefix(`/api`) && !PathPrefix(`/ws`)"
      - "traefik.http.routers.spa-${PROJECT}.entrypoints=web"
      - "traefik.http.routers.spa-${PROJECT}.service=spa-${PROJECT}"
      - "traefik.http.services.spa-${PROJECT}.loadbalancer.server.port=8080"
      - "traefik.docker.network=proxy"
    networks:
      - default
      - proxy
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://127.0.0.1:8080"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The MPA (apps/mpa), the public website: `COMPOSE_PROFILES=mpa` in the env file starts it, and
  # `deno task deploy` then deploys it. Without the profile it does not exist, and nothing else
  # changes. It serves `MPA_DOMAIN` next to the SPA at `DOMAIN`, and refuses to start without it.
  # `${MPA_DOMAIN:-}`, not `${MPA_DOMAIN:?}`: Compose interpolates every service, profiled or not,
  # so `:?` would break the default deploy. Built into the image: no bind mounts.
  mpa:
    container_name: ${PROJECT}-mpa
    profiles: [mpa]
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: apps/mpa/dockerfile.prod
      args:
        - DENO_VERSION=${DENO_VERSION}
    environment:
      - ENV=${ENV}
      - DOMAIN=${DOMAIN}
      - MPA_DOMAIN=${MPA_DOMAIN:-}
      - API_URL=http://api:${API_PORT}
      - DENO_LOG=${DENO_LOG}
    user: "1000:1000"
    deploy:
      resources:
        limits:
          # Defaults, so an env file written before this service existed still deploys.
          cpus: '${MPA_CPU_LIMIT:-1}'
          memory: '${MPA_MEM_LIMIT:-512M}'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      api:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mpa-${PROJECT}.rule=Host(`${MPA_DOMAIN:-}`)"
      - "traefik.http.routers.mpa-${PROJECT}.entrypoints=web"
      - "traefik.http.routers.mpa-${PROJECT}.service=mpa-${PROJECT}"
      - "traefik.http.services.mpa-${PROJECT}.loadbalancer.server.port=8080"
      - "traefik.docker.network=proxy"
    networks:
      - default
      - proxy
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # endregion API & SPA

# region Networking
networks:
  proxy:
    external: true
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.50.0.0/16
