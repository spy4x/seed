# APP_RUNTIME=bun in the env file: `deno task compose` adds this file after compose.${ENV}.yml
# (infra/scripts/compose-plan.ts), and the API, the worker and the migration run on Bun, from the
# bundles apps/api/dockerfile.bun builds (docs/apps.md, "Runtime"). Everything else, the ports, the
# environment and the dependencies, stays as compose.shared.yml sets it. The bundles are made at
# build time, so a code change needs `deno task compose up -d --build`, even in development.
services:
  migrate:
    build:
      dockerfile: apps/api/dockerfile.bun
    command: [ 'bun', 'dist/server/migrate.js' ]

  api:
    build:
      dockerfile: apps/api/dockerfile.bun
    command: [ 'bun', 'dist/server/api.js' ]
    healthcheck:
      test: [ 'CMD', 'bun', 'dist/server/healthcheck.js', '/api/health' ]

  worker:
    build:
      dockerfile: apps/api/dockerfile.bun
    command: [ 'bun', 'dist/server/worker.js' ]
