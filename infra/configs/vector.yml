# Vector ships this project's container logs to VictoriaLogs: to VLOGS_URL, or to the bundled
# VictoriaLogs when that is unset (infra/compose/compose.shared.yml). A dollar sign with a name in
# braces is pasted in from the container's environment as text, before the file is parsed, in
# comments too. So only values that cannot break the file come in that way: the project name, the
# address and the credentials in base64. The user name and the password themselves never do.
sources:
  containers:
    type: docker_logs
    # Not the Docker socket: the proxy in front of it, which passes on only the read calls this
    # source makes (infra/compose/compose.shared.yml, `socket-proxy`).
    docker_host: tcp://socket-proxy:2375
    # The label Compose puts on every container of this project. It is an exact match; a name
    # prefix would also take the containers of a project called `<this one>-staging`. The value
    # is Compose's own name for the project, which it writes in lower case whatever PROJECT says:
    # with PROJECT as typed, a capital letter would match no container at all.
    include_labels: ['com.docker.compose.project=${COMPOSE_PROJECT_NAME}']
    # Its own log would otherwise report every failed send as a new line to send.
    exclude_containers: ['${PROJECT}-vector']

transforms:
  logs:
    type: remap
    inputs: [containers]
    source: |
      .project = "${PROJECT}"
      # Compose puts a dozen labels on every container; none helps to read a log line.
      del(.label)

  # The API has no metrics endpoint yet, so its requests are counted from its request log, whose
  # lines end like `--> GET /api/groups 200 3ms` (@spy4x/server/request-log; the status is wrapped
  # in a colour code). One counter per status class, api_requests_total{status="2xx"} to "5xx".
  # A change of that log format stops the counter, and with it the ApiErrors alert:
  # tests/monitoring-alerts.test.ts runs this pattern over the lines the API's logger writes.
  api_requests:
    type: remap
    inputs: [containers]
    source: |
      if .container_name != "${PROJECT}-api" { abort }
      parsed, err = parse_regex(string!(.message), r'--> [A-Z]+ \S+ (?:\x1b\[\d+m)?(?<class>\d)\d\d')
      if err != null { abort }
      . = { "status": string!(parsed.class) + "xx" }
  api_request_metrics:
    type: log_to_metric
    inputs: [api_requests]
    metrics:
      - type: counter
        field: status
        name: api_requests_total
        tags:
          status: '{{status}}'

  # The backup service writes `Backup done.` at the end of every complete run
  # (infra/backup/backup.sh). backup_last_success_timestamp_seconds is the time of the newest such
  # line, and the BackupMissing alert reads its age. A project without the backup profile writes
  # none and has no series. tests/monitoring-alerts.test.ts holds this pattern to the script's line.
  backup_runs:
    type: remap
    inputs: [containers]
    source: |
      if .container_name != "${PROJECT}-backup" { abort }
      if !match(string!(.message), r'Z Backup done\.$') { abort }
      . = { "finished": to_unix_timestamp(timestamp!(.timestamp)) }
  backup_metrics:
    type: log_to_metric
    inputs: [backup_runs]
    metrics:
      - type: gauge
        field: finished
        name: backup_last_success_timestamp_seconds

sinks:
  victorialogs:
    type: elasticsearch
    inputs: [logs]
    endpoints: ['${VLOGS_URL}/insert/elasticsearch/']
    api_version: v8
    compression: gzip
    healthcheck:
      enabled: false
    query:
      _msg_field: message
      _time_field: timestamp
      _stream_fields: project,container_name,stream
    # HTTP basic auth. The container's entrypoint encodes VLOGS_USERNAME and VLOGS_PASSWORD into
    # VLOGS_AUTH, so a quote or a hash sign in the password cannot change this file.
    request:
      headers:
        Authorization: 'Basic ${VLOGS_AUTH}'
  # Scraped by vmagent (infra/configs/vmagent.yml).
  metrics:
    type: prometheus_exporter
    inputs: [api_request_metrics, backup_metrics]
    address: 0.0.0.0:9598
    # Keep a counter that no request has moved for a day, so a quiet API does not lose its series.
    # The backup's gauge, set once a day, may still drop out between two runs or at a restart:
    # BackupMissing reads its newest value over 14 days, so a gap does not matter.
    flush_period_secs: 86400
