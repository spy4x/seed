# vmalert's rules (bundled mode). Alertmanager sends what fires to ntfy: ALERT_NTFY_URL in the env
# file. In the external mode the same file can be given to the vmalert of the other server: every
# series carries a `project` label.
groups:
  - name: api
    rules:
      # api_requests_total is counted by Vector from the API's request log (infra/configs/vector.yml).
      - alert: ApiErrors
        expr: sum by (project) (increase(api_requests_total{status="5xx"}[5m])) >= 5
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.project }}: the API answered {{ $value | printf "%.0f" }} requests with a 5xx error in 5 minutes'
          description: 'Read the API log in Grafana (VictoriaLogs, container_name: the api container) and the error tracker.'

  - name: disk
    rules:
      # The disk that holds .volumes, so Postgres' data too. VictoriaMetrics reports it about its
      # own storage path, with no host exporter needed (vmagent scrapes it: job victoriametrics).
      - alert: DataDiskSpaceLow
        expr: vm_free_disk_space_bytes < 2 * 1024 * 1024 * 1024
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.project }}: the data disk has {{ $value | humanize1024 }}B free'
          description: 'Postgres, VictoriaMetrics and VictoriaLogs stop taking writes when it is full.'
      # Every disk of the host. Has data only with the host-monitoring profile (node-exporter).
      - alert: HostDiskSpaceLow
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"} < 0.10
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.project }}: {{ $labels.mountpoint }} has {{ $value | humanizePercentage }} free'
          description: 'Less than 10% of the disk at {{ $labels.mountpoint }} is free.'

  - name: backup
    rules:
      # backup_last_success_timestamp_seconds is the time of the backup service's last complete
      # run, which Vector reads from its "Backup done." line (infra/configs/vector.yml). Its newest
      # value over 14 days, so a gap in the series (Vector restarted, a day with no line) does not
      # hide it. 14 days is the bundled VictoriaMetrics' -retentionPeriod, which leaves older
      # samples out of every query: a longer window would only look longer
      # (tests/monitoring-alerts.test.ts holds the two together). So 14 days after the last complete
      # backup the series is gone and the alert resolves, and ntfy says "resolved", although no
      # backup has run. A project that never switched the backup profile on has no series and no
      # alert. Tested in infra/configs/alerts.test.yml.
      - alert: BackupMissing
        expr: |
          time() - max by (project) (
            max_over_time(backup_last_success_timestamp_seconds[14d])
          ) > 2 * 86400
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.project }}: no backup has completed for {{ $value | humanizeDuration }}'
          description: 'Read the backup log (deno task compose logs backup) and docs/backups.md, "When the backup is unhealthy".'
