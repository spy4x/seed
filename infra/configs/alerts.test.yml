# Unit tests of the alert rules in alerts.yml, run by vmalert-tool (.woodpecker/ci.yml,
# `alert-rules`). Time starts at 0, the first second of 1970, so a gauge that holds a Unix time
# holds the hours below times 3600.
rule_files:
  - alerts.yml
evaluation_interval: 1h

tests:
  # The backup service completes a run every 24 hours. Vector keeps the gauge while it runs.
  - interval: 1h
    input_series:
      - series: 'backup_last_success_timestamp_seconds{project="seed"}'
        values: '0x23 86400x23 172800x23 259200x23'
    alert_rule_test:
      - eval_time: 95h
        groupname: backup
        alertname: BackupMissing
        exp_alerts: []

  # The last run completes at hour 0; the series stops a day later, as when Vector drops a gauge
  # nothing set for a day. Quiet before two days, firing after, still firing at 12.5 days, and
  # resolved once the last sample is older than the rule's 14-day window (the retention of the
  # bundled VictoriaMetrics, which drops it anyway).
  - interval: 1h
    input_series:
      - series: 'backup_last_success_timestamp_seconds{project="seed"}'
        values: '0x23'
    alert_rule_test:
      - eval_time: 47h
        groupname: backup
        alertname: BackupMissing
        exp_alerts: []
      - eval_time: 49h
        groupname: backup
        alertname: BackupMissing
        exp_alerts:
          - exp_labels:
              project: seed
              severity: critical
            exp_annotations:
              summary: 'seed: no backup has completed for 2d 1h 0m 0s'
              description: 'Read the backup log (deno task compose logs backup) and docs/backups.md, "When the backup is unhealthy".'
      - eval_time: 300h
        groupname: backup
        alertname: BackupMissing
        exp_alerts:
          - exp_labels:
              project: seed
              severity: critical
            exp_annotations:
              summary: 'seed: no backup has completed for 12d 12h 0m 0s'
              description: 'Read the backup log (deno task compose logs backup) and docs/backups.md, "When the backup is unhealthy".'
      - eval_time: 360h
        groupname: backup
        alertname: BackupMissing
        exp_alerts: []

  # A project without the backup profile: no backup line, no series, no alert.
  - interval: 1h
    input_series:
      - series: 'api_requests_total{project="seed",status="2xx"}'
        values: '0+10x72'
    alert_rule_test:
      - eval_time: 72h
        groupname: backup
        alertname: BackupMissing
        exp_alerts: []

  # The two disk rules fire on a series with `project`, as every series a Seed project sends has.
  # The same series without it, as the host's own exporters write it on a shared host's
  # VictoriaMetrics, fires nothing: the host's own rules watch its disks. Both rules wait 10
  # minutes, so they fire at the second hourly evaluation.
  - interval: 1h
    input_series:
      - series: 'vm_free_disk_space_bytes{project="seed",path="/storage"}'
        values: '1073741824x5'
      - series: 'vm_free_disk_space_bytes{path="/vm-data"}'
        values: '1073741824x5'
    alert_rule_test:
      - eval_time: 2h
        groupname: disk
        alertname: DataDiskSpaceLow
        exp_alerts:
          - exp_labels:
              project: seed
              path: /storage
              severity: critical
            exp_annotations:
              summary: 'seed: the data disk has 1GiB free'
              description: 'Postgres, VictoriaMetrics and VictoriaLogs stop taking writes when it is full.'

  - interval: 1h
    input_series:
      - series: 'node_filesystem_avail_bytes{project="seed",mountpoint="/",fstype="ext4"}'
        values: '5x5'
      - series: 'node_filesystem_size_bytes{project="seed",mountpoint="/",fstype="ext4"}'
        values: '100x5'
      - series: 'node_filesystem_avail_bytes{mountpoint="/",fstype="ext4"}'
        values: '5x5'
      - series: 'node_filesystem_size_bytes{mountpoint="/",fstype="ext4"}'
        values: '100x5'
    alert_rule_test:
      - eval_time: 2h
        groupname: disk
        alertname: HostDiskSpaceLow
        exp_alerts:
          - exp_labels:
              project: seed
              mountpoint: /
              fstype: ext4
              severity: critical
            exp_annotations:
              summary: 'seed: / has 5% free'
              description: 'Less than 10% of the disk at / is free.'
