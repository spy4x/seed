# What vmagent scrapes. It pushes every sample to VM_REMOTE_WRITE_URL, or to the bundled
# VictoriaMetrics when that is unset (infra/compose/compose.shared.yml).
global:
  scrape_interval: 30s

scrape_configs:
  - job_name: vmagent
    static_configs:
      - targets: ['vmagent:8429']
  # Vector's own metrics, and the API's error lines it counts (infra/configs/vector.yml).
  - job_name: vector
    static_configs:
      - targets: ['vector:9598']
  # The bundled VictoriaMetrics, for the free space of the disk it stores on
  # (infra/configs/alerts.yml). Shows as down in the external mode.
  - job_name: victoriametrics
    static_configs:
      - targets: ['victoriametrics:8428']
  - job_name: postgres
    static_configs:
      - targets: ['postgres-prometheus-exporter:9187']
  # The two below run only with the host-monitoring profile and show as down without it.
  - job_name: nodeexporter
    static_configs:
      - targets: ['nodeexporter:9100']
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
