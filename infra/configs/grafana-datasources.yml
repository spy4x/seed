# Grafana's data sources in the bundled mode (the `monitoring` Compose profile).
apiVersion: 1

datasources:
  # VictoriaMetrics answers Prometheus' query API, so Grafana's built-in type works.
  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
  - name: VictoriaLogs
    uid: victorialogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victorialogs:9428
