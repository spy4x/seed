# Puts gzip in front of the MPA for the Lighthouse check (run.sh), as the CDN does in production:
# measured uncompressed, the stylesheet alone costs the home page about ten performance points.
worker_processes 1;
pid nginx.pid;
error_log stderr;
events {}
http {
  access_log off;
  gzip on;
  gzip_proxied any;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml
    text/plain application/xml;
  # Paths inside the prefix run.sh passes, not the distribution's, which need root. No temp files
  # for proxied responses: the prefix belongs to whoever runs the script, not to nginx's worker.
  client_body_temp_path tmp;
  proxy_temp_path tmp;
  fastcgi_temp_path tmp;
  uwsgi_temp_path tmp;
  scgi_temp_path tmp;
  proxy_max_temp_file_size 0;
  server {
    listen 127.0.0.1:48411;
    location / {
      proxy_pass http://127.0.0.1:48410;
      proxy_set_header Host $http_host;
    }
  }
}
