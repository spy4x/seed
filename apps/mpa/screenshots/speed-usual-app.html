<!doctype html>
<!--
  The left half of the `speed` loop (loops.ts): a made-up notes app that asks its server on every
  click, so each screen waits behind a spinner. Generic on purpose: no brand, no real product.
  loops.ts serves it from a fake origin and fills in the notes; it loads nothing from outside.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="dark">
    <title>Notes</title>
    <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #17191c;
      color: #e4e6e9;
      font: 15px/1.45 system-ui, sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 56px;
      padding: 0 16px;
      border-bottom: 1px solid #2b2f34;
      font-size: 19px;
      font-weight: 600;
    }
    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer;
    }
    .back {
      width: 36px;
      height: 36px;
      margin-inline-start: -8px;
      font-size: 22px;
    }
    ul {
      margin: 0;
      padding: 8px 12px;
      list-style: none;
    }
    li button {
      display: block;
      width: 100%;
      margin-bottom: 8px;
      padding: 12px 14px;
      text-align: start;
      background: #202327;
      border: 1px solid #2b2f34;
      border-radius: 6px;
    }
    li span {
      display: block;
      color: #8d939b;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    article {
      padding: 16px;
    }
    article h1 {
      margin: 0 0 12px;
      font-size: 21px;
      line-height: 1.3;
    }
    article p {
      margin: 0;
      color: #c3c7cc;
    }
    .spinner {
      display: flex;
      justify-content: center;
      padding-top: 120px;
    }
    .spinner::before {
      content: "";
      width: 36px;
      height: 36px;
      border: 4px solid #2f3439;
      border-top-color: #9aa3ad;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(1turn);
      }
    }
    </style>
  </head>
  <body>
    <header><button class="back" data-back hidden aria-label="Back">←</button><span>Notes</span></header>
    <main></main>
    <script>
    // Filled in by loops.ts: [{ title, body }], in the order the real app lists them.
    const NOTES = "__NOTES__"
    // How long every screen waits for its "server".
    const WAIT = Number("__WAIT__")
    const main = document.querySelector(`main`)
    const back = document.querySelector(`[data-back]`)

    /** Shows the spinner, then after the wait draws the screen. */
    function load(draw) {
      main.innerHTML = `<div class="spinner" data-spinner></div>`
      setTimeout(() => {
        main.innerHTML = ``
        draw()
      }, WAIT)
    }

    function list() {
      back.hidden = true
      load(() => {
        const ul = document.createElement(`ul`)
        for (const [index, note] of NOTES.entries()) {
          const li = document.createElement(`li`)
          const button = document.createElement(`button`)
          button.dataset.note = String(index)
          button.textContent = note.title
          const snippet = document.createElement(`span`)
          snippet.textContent = note.body
          button.append(snippet)
          button.addEventListener(`click`, () => open(note))
          li.append(button)
          ul.append(li)
        }
        main.append(ul)
      })
    }

    function open(note) {
      back.hidden = false
      load(() => {
        const article = document.createElement(`article`)
        const title = document.createElement(`h1`)
        title.textContent = note.title
        const body = document.createElement(`p`)
        body.textContent = note.body
        article.append(title, body)
        main.append(article)
      })
    }

    back.addEventListener(`click`, list)
    list()
    </script>
  </body>
</html>
