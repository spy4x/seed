# The access log records the path only, never the query or the Referer: a password reset link
# carries its code in the query (/reset-password?email=...&code=...), a subscription link its token
# (/unsubscribe?list=...&token=...), and container logs are shipped.
# The path comes from $request_uri, as the browser sent it: $uri would read /index.html for every
# page after try_files.
map $request_uri $request_path {
    ~^(?<path>[^?]*) $path;
}
log_format path_only '$remote_addr [$time_local] "$request_method $request_path $server_protocol" $status $body_bytes_sent';

server {
    listen 8080;
    server_name localhost;
    access_log /var/log/nginx/access.log path_only;

    root /usr/share/nginx/html;
    index index.html;

    # The security headers: a content security policy, nosniff, no referrer, no framing, HSTS and
    # the rest of what `securityHeaders` of @spy4x/server sends. The build writes the file from the
    # built index.html, because the policy holds the hash of each inline block of that page
    # (apps/spa/vite.config.ts). docs/security-headers.md explains each one.
    #
    # The first file is written when the container starts (csp-connect.sh): it sets
    # $csp_error_tracker, the one origin of the policy that differs per deployment.
    #
    # nginx drops every inherited `add_header` in a block that has one of its own, so each
    # `location` below that adds a header includes the file again.
    include /tmp/csp-connect.conf;
    include /etc/nginx/spa/security-headers.conf;

    # No byte ranges: nginx answers a range it cannot satisfy with a 416 that carries every header
    # above twice. The app's files are small and none is a video, which is what needs ranges.
    max_ranges 0;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The runtime settings change with the container, not with the build: never serve a stale copy.
    location = /config.json {
        include /etc/nginx/spa/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # The service worker: a browser checks this file for an update, and a copy kept by a cache in
    # between would hide a deploy. (The files under /assets/ are named by hash and may be cached.)
    # The worker runs under the policy this response carries.
    location = /sw.js {
        include /etc/nginx/spa/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # The reset page holds its code in the address, and the subscription pages a signed token.
    # Their requests send no Referer because no page does: the headers above say `no-referrer`.
    # No cache keeps a subscription page.
    location ~ ^/(subscribe/confirm|unsubscribe)$ {
        include /etc/nginx/spa/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    # Optional: gzip static files
    gzip on; 
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;
}
