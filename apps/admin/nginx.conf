# The access log records the path only, never the query: the user list's search is in the query,
# and container logs are shipped. $request_uri is the path as the browser sent it.
map $request_uri $request_path {
    ~^(?<path>[^?]*) $path;
}
log_format path_only '$remote_addr [$time_local] "$request_method $request_path $server_protocol" $status $body_bytes_sent';

server {
    listen 8080;
    server_name localhost;
    access_log /var/log/nginx/access.log path_only;

    root /usr/share/nginx/html;
    index index.html;

    # The security headers, written by the build from the built index.html, as for the SPA
    # (apps/admin/vite.config.ts, docs/security-headers.md). The admin app has no setting that
    # differs per deployment, so it has no file written at start.
    include /etc/nginx/admin/security-headers.conf;

    # No byte ranges: nginx answers a range it cannot satisfy with a 416 that carries every header
    # above twice.
    max_ranges 0;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;
}
