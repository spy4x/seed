# Continuous integration: runs on every pull request, every push to main and every tag (release.yml
# waits for it).
#
# Woodpecker reads every `*.yml` in this folder as its own workflow. Deploys are not wired up: see
# `deploy.yml.example` and docs/woodpecker-ci-setup.md.
#
# Deno 2.9.7 is the version the repository uses (`DENO_VERSION` in infra/envs/.env.example and
# Dockerfile.base). Playwright 1.57.0 is the version `deno task e2e` runs (deno.jsonc); the e2e
# image tag must match it, because the browser build inside the image is tied to that version.

when:
  - event: pull_request
  - event: push
    branch: main
  - event: tag

steps:
  check:
    image: denoland/deno:2.9.7
    commands:
      - deno install --frozen
      - deno task check

  build:
    image: denoland/deno:2.9.7
    commands:
      - deno install --frozen
      - deno task build
    depends_on: [check]

  integration:
    image: denoland/deno:2.9.7
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: tester
      DB_PASS: ci-throwaway
      DB_NAME: template_test
      KV_HOSTNAME: valkey
      KV_PORT: "6379"
      KV_PASSWORD: ci-throwaway
    commands:
      - deno install --frozen
      # Wait over TCP. Postgres first runs a temporary server that listens on a unix socket only,
      # so a successful TCP connection means the real server is up (docs/handoff.md, trap 3).
      # Valkey has no such phase.
      - |
          deno eval '
          for (const [hostname, port] of [["postgres", 5432], ["valkey", 6379]]) {
            for (let i = 0; ; i++) {
              try {
                (await Deno.connect({ hostname, port })).close()
                break
              } catch {
                if (i === 120) {
                  console.error(`${hostname} did not accept connections within 60 s`)
                  Deno.exit(1)
                }
                await new Promise((resolve) => setTimeout(resolve, 500))
              }
            }
          }
          '
      - deno task test:integration
    depends_on: [check]

  e2e:
    # The image carries Chromium and its system libraries. Installing the browser through Deno
    # (`playwright install`) downloads it and then hangs (issue 48), so nothing is installed here.
    image: mcr.microsoft.com/playwright:v1.57.0-noble
    commands:
      # npm's newest `deno` package lags the binary, so take the pinned release itself.
      - |
          curl -fsSL -o /tmp/deno.zip https://github.com/denoland/deno/releases/download/v2.9.7/deno-x86_64-unknown-linux-gnu.zip
          echo "c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490  /tmp/deno.zip" | sha256sum -c -
          apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip
          unzip -q -o /tmp/deno.zip -d /usr/local/bin
          chmod +x /usr/local/bin/deno
      - deno --version
      - deno install --frozen
      # The other two e2e tests need the full Docker stack; this one serves its own fixture.
      - deno task e2e url-filters
    depends_on: [check]

  e2e-mpa:
    # The MPA's browser tests: with JavaScript turned off, a visitor subscribes to the newsletter,
    # confirms and unsubscribes through the mailed links. e2e/mpa/run.sh migrates, starts the API,
    # the worker and the MPA behind one origin and runs them. It creates its own database
    # (`template_e2e`), so it shares nothing with the integration step, which uses `template_test`
    # at the same time. `DB_NAME` below is only the database the script connects to first.
    image: mcr.microsoft.com/playwright:v1.57.0-noble
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: tester
      DB_PASS: ci-throwaway
      DB_NAME: template_test
      KV_HOSTNAME: valkey
      KV_PORT: "6379"
      KV_PASSWORD: ci-throwaway
    commands:
      # npm's newest `deno` package lags the binary, so take the pinned release itself.
      - |
          curl -fsSL -o /tmp/deno.zip https://github.com/denoland/deno/releases/download/v2.9.7/deno-x86_64-unknown-linux-gnu.zip
          echo "c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490  /tmp/deno.zip" | sha256sum -c -
          apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip
          unzip -q -o /tmp/deno.zip -d /usr/local/bin
          chmod +x /usr/local/bin/deno
      - deno --version
      - deno install --frozen
      # Postgres first runs a temporary server that listens on a unix socket only, so a TCP
      # connection means the real one is up (docs/handoff.md, trap 3). Valkey has no such phase.
      - |
          deno eval '
          for (const [hostname, port] of [["postgres", 5432], ["valkey", 6379]]) {
            for (let i = 0; ; i++) {
              try {
                (await Deno.connect({ hostname, port })).close()
                break
              } catch {
                if (i >= 120) {
                  console.error(`$${hostname} did not accept connections within 60 s`)
                  Deno.exit(1)
                }
                await new Promise((resolve) => setTimeout(resolve, 500))
              }
            }
          }
          '
      - e2e/mpa/run.sh
    depends_on: [check]

  e2e-spa:
    # The SPA behind nginx, as production serves it: the security headers nginx.conf adds, and a
    # signed-in walk that fails on anything the content security policy refuses. Vite, which the
    # other e2e steps use, sends no such headers. Steps have no container tool, so e2e/spa/run.sh
    # installs the built SPA into this container's own nginx (`SPA_SERVER=nginx`) instead of
    # building the image. It creates its own database (`template_e2e_spa`).
    image: mcr.microsoft.com/playwright:v1.57.0-noble
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: tester
      DB_PASS: ci-throwaway
      DB_NAME: template_test
      KV_HOSTNAME: valkey
      KV_PORT: "6379"
      KV_PASSWORD: ci-throwaway
    commands:
      # npm's newest `deno` package lags the binary, so take the pinned release itself.
      - |
          curl -fsSL -o /tmp/deno.zip https://github.com/denoland/deno/releases/download/v2.9.7/deno-x86_64-unknown-linux-gnu.zip
          echo "c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490  /tmp/deno.zip" | sha256sum -c -
          apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip
          unzip -q -o /tmp/deno.zip -d /usr/local/bin
          chmod +x /usr/local/bin/deno
      - deno --version
      - deno install --frozen
      # Postgres first runs a temporary server that listens on a unix socket only, so a TCP
      # connection means the real one is up (docs/handoff.md, trap 3). Valkey has no such phase.
      - |
          deno eval '
          for (const [hostname, port] of [["postgres", 5432], ["valkey", 6379]]) {
            for (let i = 0; ; i++) {
              try {
                (await Deno.connect({ hostname, port })).close()
                break
              } catch {
                if (i >= 120) {
                  console.error(`$${hostname} did not accept connections within 60 s`)
                  Deno.exit(1)
                }
                await new Promise((resolve) => setTimeout(resolve, 500))
              }
            }
          }
          '
      - apt-get install -y -qq --no-install-recommends nginx
      - SPA_SERVER=nginx e2e/spa/run.sh
    # The steps share one checkout. This one builds the SPA into apps/spa/dist, as `build` does,
    # and both run scripts keep the API's vapid.json in the repository root while they run, so it
    # waits for those two steps instead of running beside them.
    depends_on: [build, e2e-mpa]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tester
      POSTGRES_PASSWORD: ci-throwaway
      POSTGRES_DB: template_test
  valkey:
    image: valkey/valkey:8.1
    commands:
      - valkey-server --requirepass ci-throwaway
