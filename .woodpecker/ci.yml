# Continuous integration: runs on every pull request, every push to main, every release tag
# `v<digit>*` (release.yml waits for it) and the nightly cron run on main
# (docs/woodpecker-ci-setup.md, "The nightly run").
# A push to main runs only `check`, `secrets`, the images and `android`: its pull request already
# ran the rest. The browser steps (`browser`, `lighthouse`, `e2e-smoke`, `e2e-full`) are in
# ci-browser.yml, a workflow of its own that runs at the same time as this one, in its own
# checkout with its own services, on every event here but a push to main
# (https://github.com/spy4x/ringmaster/issues/297).
#
# A pull request whose title starts with `[WIP]` runs wip.yml instead (`check` and `secrets` only,
# #1058), and neither this workflow nor ci-browser.yml. Woodpecker sets `CI_COMMIT_MESSAGE` to the
# pull request's title on `pull_request` and `pull_request_metadata`. Removing `[WIP]` from the
# title is a `pull_request_metadata` event with the reason `edited`, so it starts this workflow
# and ci-browser.yml without a push; every step that runs on `pull_request` therefore has a twin
# condition for `pull_request_metadata`, or a title edit would report `ci/woodpecker/pr/ci` or
# `ci/woodpecker/pr/ci-browser` green after a short run. A body edit is `edited` too and re-runs
# both workflows on a ready pull request: rare, and accepted. A commit pushed while the title
# starts with `[WIP]` gets neither status, which branch protection requires, so it cannot merge.
# Putting `[WIP]` back without a push runs nothing and keeps the head's earlier statuses, so it
# does not block a merge.
#
# Woodpecker reads every `*.yml` in this folder as its own workflow. A product turns on deploys on
# every push to main by copying `deploy.yml.example` (docs/woodpecker-ci-setup.md).
#
# Deno 2.9.7 is the version the repository uses (`DENO_VERSION` in infra/envs/.env.example and
# Dockerfile.base).
#
# Woodpecker runs the steps in stages: a step starts only when every step of the stage before has
# ended, not only the ones it depends on. A stage lasts as long as its slowest step, so the wall
# time is the sum of the slowest step of each stage.

when:
  - event: pull_request
    evaluate: 'not (CI_COMMIT_MESSAGE startsWith "[WIP]")'
  # `CI_PIPELINE_EVENT_REASON` joins the reasons with commas; GitHub sends one per event.
  - event: pull_request_metadata
    evaluate: 'CI_PIPELINE_EVENT_REASON contains "edited" && not (CI_COMMIT_MESSAGE startsWith "[WIP]")'
  - event: push
    branch: main
  # Release tags only: a `ci-image-*` tag runs ci-image.yml alone.
  - event: tag
    ref: refs/tags/v[0-9]*
  - event: cron

variables:
  # Markdown that only `check`, Lighthouse and the browser tests read. A pull request that
  # changes only these skips the steps that start the stack (integration, backup-restore,
  # alert-rules, runtimes, and e2e-smoke in ci-browser.yml): they cannot fail over them, and they
  # took about 20 minutes (homelab#131). `check` still runs, and so do Lighthouse and the images
  # when their own lists name a changed file. Woodpecker skips a step with an `exclude` list only
  # when every changed file matches it. A push to main runs none of the steps that start the
  # stack. ci-browser.yml holds a copy of this list; this file is the source. .githooks/pre-push
  # holds the Markdown part of it.
  - &markdown_only
    - "*.md"
    - "**/README.md"
    - docs/**/*.md
    - i18n/*.md
    - .github/**
    - .claude/**
  # Every `pull_request` condition here and in the steps has a `pull_request_metadata` twin with
  # the same `path` (see the top). Woodpecker applies `path` to both events, and GitHub lists the
  # pull request's changed files on both; were none listed, the step would run, which is safe.
  - &stack_when
    - event: pull_request
      path:
        exclude: *markdown_only
    - event: pull_request_metadata
      path:
        exclude: *markdown_only
    - event: cron
    - event: tag
  # When the four image steps run: see image-node.
  - &image_when
    - event: pull_request
      # What decides whether an image builds: the four Dockerfiles, .dockerignore, the manifest,
      # the lockfile and this file. A source change is built on `main` (see image-node).
      path: &image_paths
        - apps/api/dockerfile.node
        - apps/api/dockerfile.bun
        - apps/mpa/dockerfile.node
        - apps/mpa/dockerfile.bun
        - .dockerignore
        - deno.jsonc
        - deno.lock
        - .woodpecker/ci.yml
    - event: pull_request_metadata
      path: *image_paths
    - event: push
      branch: main
    - event: tag

steps:
  check:
    # The deploy tests (infra/scripts/deploy.test.ts) run the real `git status` in a repository of
    # their own; the Deno image has no git. On a pull request or its title edit, `deno task test`
    # also fetches the target branch with git over HTTPS, which needs ca-certificates, and runs
    # only the test files whose imports reach a change (`relatedFlags` in infra/scripts/test.ts);
    # it fails when git does. Every other event runs them all.
    image: denoland/deno:2.9.7
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
      - deno install --frozen
      - deno task check

  secrets:
    # Scans the commits for secrets with gitleaks (#494), beside `check`. A pull request scans its
    # own commits, from where it left the target branch, so a key added in one commit and removed
    # in a later one still fails it. Every other event scans the whole history of the commit
    # (about 600 commits, seconds): that needs no previous commit, which a first push or a
    # force-push lacks. `--redact` keeps the values out of the log; reviewed findings are in
    # .gitleaksignore. The image is on ghcr.io, out of Docker Hub's pull limit (#923), and ships
    # git.
    #
    # Woodpecker clones one commit without its trees (`--depth=1 --filter=tree:0`), except on a
    # tag. Scanning that clone would fetch each missing tree and file with a request of its own
    # (40 s for the history even from a local disk), so the history is fetched whole first, with
    # the filter dropped.
    image: ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
    depends_on: []
    commands:
      - |
          set -eu
          deep=""
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git config --unset-all remote.origin.partialclonefilter || true
            deep="--unshallow --refetch"
          fi
          if [ "$${CI_PIPELINE_EVENT}" = pull_request ] || [ "$${CI_PIPELINE_EVENT}" = pull_request_metadata ]; then
            target="refs/remotes/origin/$${CI_COMMIT_TARGET_BRANCH}"
            git fetch --no-tags $${deep} origin "+refs/heads/$${CI_COMMIT_TARGET_BRANCH}:$${target}"
            base="$(git merge-base "$${target}" HEAD)" || {
              echo "HEAD shares no commit with $${target}: nothing to scan from." >&2
              exit 1
            }
            range="$${base}..HEAD"
          else
            if [ -n "$${deep}" ]; then git fetch --no-tags $${deep} origin "$${CI_COMMIT_SHA}"; fi
            range=HEAD
          fi
          echo "Scanning $${range}"
          gitleaks git --redact --verbose --no-banner --log-opts="$${range}" .

  integration:
    image: denoland/deno:2.9.7
    when: *stack_when
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: tester
      DB_PASS: ci-throwaway
      DB_NAME: template_test
      KV_HOSTNAME: valkey
      KV_PORT: "6379"
      KV_PASSWORD: ci-throwaway
    commands:
      # On a pull request or its title edit, the task runs only the test files whose imports reach
      # a change, which it finds with git, as `check` does.
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
      - deno install --frozen
      # Wait over TCP. Postgres first runs a temporary server that listens on a unix socket only,
      # so a successful TCP connection means the real server is up (docs/handoff.md, trap 3).
      # Valkey has no such phase.
      - |
          deno eval '
          for (const [hostname, port] of [["postgres", 5432], ["valkey", 6379]]) {
            for (let i = 0; ; i++) {
              try {
                (await Deno.connect({ hostname, port })).close()
                break
              } catch {
                if (i === 120) {
                  console.error(`$${hostname} did not accept connections within 60 s`)
                  Deno.exit(1)
                }
                await new Promise((resolve) => setTimeout(resolve, 500))
              }
            }
          }
          '
      # The test files run four at a time. Each works in a schema, database or key prefix of its
      # own, so they never meet; one after another they took 15 to 18 minutes.
      - DENO_JOBS=4 deno task test:integration --parallel
    depends_on: [check]

  backup-restore:
    # Backs a database up and restores it (infra/backup/restore.test.sh) with the database image's
    # own pg_dump, in databases it creates and drops. The image has no restic; Debian's package is
    # of the same 0.18 line as the one in the backup image (infra/backup/Dockerfile).
    image: postgres:18.6
    when: *stack_when
    environment:
      PGHOST: postgres
      PGUSER: tester
      PGPASSWORD: ci-throwaway
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends restic
      - infra/backup/restore.test.sh
    depends_on: [check]

  alert-rules:
    # The unit tests of the alert rules (infra/configs/alerts.test.yml), run by vmalert-tool of the
    # vmalert version in infra/compose/compose.shared.yml.
    image: victoriametrics/vmalert-tool:v1.146.0@sha256:4360dc66ac7e758d15a9704a3ab2348f8f3f47bbc0798642985d7945973a34ff
    when: *stack_when
    commands:
      - /vmalert-tool-prod unittest --files=infra/configs/alerts.test.yml
    depends_on: [check]

  runtimes:
    # Starts the API, the worker and the website on Deno, Node and Bun, and checks each answers
    # (tests/runtimes/smoke.sh, #623). The Node image gets Deno and Bun from their release zips,
    # checked against their SHA-256. The script works in its own copy of the checkout, so it runs
    # beside the other steps of its stage without sharing a build or vapid.json. It runs when
    # the stack's steps do (`stack_when`): not on a push to `main`.
    image: docker.io/library/node:26.13.0-bookworm@sha256:fa52d1669505e29b58c042875b1d65c229e0787a3610fd52869b22b68e480853
    when: *stack_when
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: tester
      DB_PASS: ci-throwaway
      DB_NAME: template_test
      KV_HOSTNAME: valkey
      KV_PORT: "6379"
      KV_PASSWORD: ci-throwaway
    commands:
      - |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /tmp/deno.zip https://github.com/denoland/deno/releases/download/v2.9.7/deno-x86_64-unknown-linux-gnu.zip
          echo "c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490  /tmp/deno.zip" | sha256sum -c -
          unzip -q -o /tmp/deno.zip -d /usr/local/bin
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /tmp/bun.zip https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip
          echo "bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c  /tmp/bun.zip" | sha256sum -c -
          unzip -q -o -j /tmp/bun.zip bun-linux-x64/bun -d /usr/local/bin
          chmod +x /usr/local/bin/deno /usr/local/bin/bun
      - deno --version && node --version && bun --version
      # smoke.sh copies the checkout with git, which refuses a repository another user owns.
      - git config --global --add safe.directory "$$PWD"
      - |
          deno eval '
          for (const [hostname, port] of [["postgres", 5432], ["valkey", 6379]]) {
            for (let i = 0; ; i++) {
              try {
                (await Deno.connect({ hostname, port })).close()
                break
              } catch {
                if (i >= 120) {
                  console.error(`$${hostname} did not accept connections within 60 s`)
                  Deno.exit(1)
                }
                await new Promise((resolve) => setTimeout(resolve, 500))
              }
            }
          }
          '
      - tests/runtimes/smoke.sh
    depends_on: [check]

  image-node:
    # Builds the Node and Bun images of the API (apps/api/dockerfile.node, apps/api/dockerfile.bun,
    # #748) and of the website (apps/mpa/dockerfile.node, apps/mpa/dockerfile.bun, #623), so a
    # change that breaks a bundle or a Dockerfile fails here, not at the release. Kaniko builds
    # inside an ordinary container, with no Docker daemon, no volume and no secret, and pushes
    # nothing (`--no-push`), as in release.yml. All four are self-contained, so no base image has
    # to be published first. One step each: kaniko builds in its own root
    # filesystem, so two builds in one container would share it.
    # Base images come through Google's public Docker Hub mirror (`--registry-mirror`), because
    # anonymous pulls from Docker Hub hit its rate limit and failed all four steps (#923). The
    # mirror needs no login; an image it lacks is pulled from Docker Hub as before.
    # A pull request builds them only when it changes what decides whether an image builds: the
    # four Dockerfiles, .dockerignore, the manifest, the lockfile and this file. Building them on
    # every source change cost about a minute of CPU each on a shared host, so a source change
    # that breaks a bundle is caught by the push to `main` after the merge
    # (https://github.com/spy4x/ringmaster/issues/296). A push to `main` and a tag always build
    # them; the nightly run builds none, since the push it runs on built them.
    image: woodpeckerci/plugin-kaniko:2.3.3@sha256:d6ecc0f37561503eeacd8f2189068c5a13c531f5629cf2ce2de0ac144824c9f4
    when: *image_when
    commands:
      - executor --context "$$PWD" --dockerfile apps/api/dockerfile.node --no-push
        --registry-mirror mirror.gcr.io
    depends_on: []

  image-bun:
    # See image-node.
    image: woodpeckerci/plugin-kaniko:2.3.3@sha256:d6ecc0f37561503eeacd8f2189068c5a13c531f5629cf2ce2de0ac144824c9f4
    when: *image_when
    commands:
      - executor --context "$$PWD" --dockerfile apps/api/dockerfile.bun --no-push
        --registry-mirror mirror.gcr.io
    depends_on: []

  image-mpa-node:
    # See image-node.
    image: woodpeckerci/plugin-kaniko:2.3.3@sha256:d6ecc0f37561503eeacd8f2189068c5a13c531f5629cf2ce2de0ac144824c9f4
    when: *image_when
    commands:
      - executor --context "$$PWD" --dockerfile apps/mpa/dockerfile.node --no-push
        --registry-mirror mirror.gcr.io
    depends_on: []

  image-mpa-bun:
    # See image-node.
    image: woodpeckerci/plugin-kaniko:2.3.3@sha256:d6ecc0f37561503eeacd8f2189068c5a13c531f5629cf2ce2de0ac144824c9f4
    when: *image_when
    commands:
      - executor --context "$$PWD" --dockerfile apps/mpa/dockerfile.bun --no-push
        --registry-mirror mirror.gcr.io
    depends_on: []

  android:
    # Builds the Android app's debug APK with `deno task android:build` (docs/android.md, #202),
    # in the Android SDK image the doc's `docker run` line uses (JDK 21, build-tools 36). The image
    # has no Deno, so the step fetches the release zip, checks its SHA-256 as `runtimes` does, and
    # unpacks it with the JDK's `jar`, since the image has no unzip. Nothing is signed or kept.
    # The step lives here, not in a workflow of its own, so the `[WIP]` rule and the
    # `pull_request_metadata` twins at the top hold for it without a copy, and a red build blocks
    # the merge through `ci/woodpecker/pr/ci`. A pull request builds it only when it changes the
    # app, the task (deno.jsonc) or this file; a push to `main` always does.
    image: ghcr.io/cirruslabs/android-sdk:36@sha256:f9b3ea9ed2b5fc9522adae82c7b4622ab7aa54207ef532c8e615a347dca08f31
    when:
      - event: pull_request
        path: &android_paths
          - apps/android/**
          - deno.jsonc
          - .woodpecker/ci.yml
      - event: pull_request_metadata
        path: *android_paths
      - event: push
        branch: main
    commands:
      - |
          set -eu
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /tmp/deno.zip https://github.com/denoland/deno/releases/download/v2.9.7/deno-x86_64-unknown-linux-gnu.zip
          echo "c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490  /tmp/deno.zip" | sha256sum -c -
          (cd /usr/local/bin && jar xf /tmp/deno.zip && chmod +x deno)
      - deno task android:build
    # After every step that reads the shared checkout: the build writes Gradle output and
    # Capacitor's packages into it, and a file that appears or vanishes mid-read failed `check`'s
    # comment test and the images' `COPY . .`. Each dependency is optional because a pull request
    # may skip it, and Woodpecker drops an optional dependency on a skipped step.
    depends_on:
      - name: check
        optional: true
      - name: secrets
        optional: true
      - name: image-node
        optional: true
      - name: image-bun
        optional: true
      - name: image-mpa-node
        optional: true
      - name: image-mpa-bun
        optional: true

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: tester
      POSTGRES_PASSWORD: ci-throwaway
      POSTGRES_DB: template_test
    # Durability off: the data is thrown away with the run, and the agent host's one disk, shared
    # with every repository's pipelines, was saturated by this service's flushes. No step relies
    # on crash safety or the WAL: backup-restore uses pg_dump and pg_restore. The entrypoint
    # still creates the user and database from the variables above, and drops to the postgres
    # user itself.
    commands:
      - docker-entrypoint.sh postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
  valkey:
    image: valkey/valkey:8.1
    commands:
      - valkey-server --requirepass ci-throwaway
