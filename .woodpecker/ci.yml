# Continuous integration: runs on every pull request, every push to main and every tag (release.yml
# waits for it).
#
# Woodpecker reads every `*.yml` in this folder as its own workflow. Deploys are not wired up: see
# `deploy.yml.example` and docs/woodpecker-ci-setup.md.
#
# Deno 2.9.7 is the version the repository uses (`DENO_VERSION` in infra/envs/.env.example and
# Dockerfile.base). Playwright 1.57.0 is the version `deno task e2e` runs (deno.jsonc); the e2e
# image tag must match it, because the browser build inside the image is tied to that version.
#
# Woodpecker runs the steps in stages: a step starts only when every step of the stage before has
# ended, not only the ones it depends on. A stage lasts as long as its slowest step, so the wall
# time is the sum of the slowest step of each stage. Steps that must run one after another in the
# shared checkout are therefore commands of one step (`browser`), not a chain of steps.

when:
  - event: pull_request
  - event: push
    branch: main
  - event: tag

variables:
  # Markdown that only `check`, Lighthouse and the browser tests read. A pull request that
  # changes only these skips the steps that start the stack (integration, backup-restore,
  # alert-rules, runtimes, e2e-smoke): they cannot fail over them, and they took about 20 minutes
  # (homelab#131). `check` still runs, and so do Lighthouse and the images when their own lists
  # name a changed file. Woodpecker skips a step with an `exclude` list only when every changed
  # file matches it.
  - &markdown_only
    - "*.md"
    - "**/README.md"
    - docs/**/*.md
    - i18n/*.md
    - .github/**
    - .claude/**
  # The same without the guides in docs/*.md, for `browser`: the website renders them and
  # e2e/mpa/docs.mpa.ts tests them (a phone-width table, headings, links, code blocks).
  - &internal_markdown
    - "*.md"
    - "**/README.md"
    - docs/*/**/*.md
    - i18n/*.md
    - .github/**
    - .claude/**
  - &stack_when
    - event: pull_request
      path:
        exclude: *markdown_only
    - event: push
      branch: main
    - event: tag
  - &browser_when
    - event: pull_request
      path:
        exclude: *internal_markdown
    - event: push
      branch: main
    - event: tag
  # When the four image steps run: see image-node.
  - &image_when
    - event: pull_request
      path:
        # What .dockerignore lets into the build context, the Dockerfiles among apps/, and this
        # file.
        - apps/**
        - libs/**
        - i18n/**
        - infra/**
        - docs/*.md
        - e2e/*
        - media/demo/*
        - deno.jsonc
        - deno.lock
        - .dockerignore
        - .woodpecker/ci.yml
    - event: push
      branch: main
    - event: tag

steps:
  check:
    # The deploy tests (infra/scripts/deploy.test.ts) run the real `git status` in a repository of
    # their own; the Deno image has no git.
    image: denoland/deno:2.9.7
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
      - deno install --frozen
      - deno task check

  integration:
    image: denoland/deno:2.9.7
    when: *stack_when
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: tester
      DB_PASS: ci-throwaway
      DB_NAME: template_test
      KV_HOSTNAME: valkey
      KV_PORT: "6379"
      KV_PASSWORD: ci-throwaway
    commands:
      - deno install --frozen
      # Wait over TCP. Postgres first runs a temporary server that listens on a unix socket only,
      # so a successful TCP connection means the real server is up (docs/handoff.md, trap 3).
      # Valkey has no such phase.
      - |
          deno eval '
          for (const [hostname, port] of [["postgres", 5432], ["valkey", 6379]]) {
            for (let i = 0; ; i++) {
              try {
                (await Deno.connect({ hostname, port })).close()
                break
              } catch {
                if (i === 120) {
                  console.error(`$${hostname} did not accept connections within 60 s`)
                  Deno.exit(1)
                }
                await new Promise((resolve) => setTimeout(resolve, 500))
              }
            }
          }
          '
      # The test files run four at a time. Each works in a schema, database or key prefix of its
      # own, so they never meet; one after another they took 15 to 18 minutes.
      - DENO_JOBS=4 deno task test:integration --parallel
    depends_on: [check]

  backup-restore:
    # Backs a database up and restores it (infra/backup/restore.test.sh) with the database image's
    # own pg_dump, in databases it creates and drops. The image has no restic; Debian's package is
    # of the same 0.18 line as the one in the backup image (infra/backup/Dockerfile).
    image: postgres:18.6
    when: *stack_when
    environment:
      PGHOST: postgres
      PGUSER: tester
      PGPASSWORD: ci-throwaway
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends restic
      - infra/backup/restore.test.sh
    depends_on: [check]

  alert-rules:
    # The unit tests of the alert rules (infra/configs/alerts.test.yml), run by vmalert-tool of the
    # vmalert version in infra/compose/compose.shared.yml.
    image: victoriametrics/vmalert-tool:v1.146.0@sha256:4360dc66ac7e758d15a9704a3ab2348f8f3f47bbc0798642985d7945973a34ff
    when: *stack_when
    commands:
      - /vmalert-tool-prod unittest --files=infra/configs/alerts.test.yml
    depends_on: [check]

  browser:
    # Three checks that share the checkout, one after another in this one step, beside
    # `integration` (see the top of this file):
    # - build: the SPA builds for production (apps/spa/dist).
    # - e2e-mpa: the MPA's browser tests. With JavaScript turned off, a visitor subscribes to the
    #   newsletter, confirms and unsubscribes through the mailed links. e2e/mpa/run.sh migrates,
    #   starts the API, the worker and the MPA, on a host apart from the app's, in a database of
    #   its own (`template_e2e`), so it shares nothing with `integration`, which uses
    #   `template_test` at the same time. `DB_NAME` below is only the database the scripts connect
    #   to first.
    # - e2e-spa: the SPA behind nginx, as production serves it: the security headers nginx.conf
    #   adds, and a signed-in walk that fails on anything the content security policy refuses.
    #   Vite, which the other e2e runs use, sends no such headers. Steps have no container tool, so
    #   e2e/spa/run.sh installs the built SPA into this container's own nginx
    #   (`SPA_SERVER=nginx`) instead of building the image, in a database of its own
    #   (`template_e2e_spa`).
    # Why not three steps: build and e2e-spa both build the SPA into apps/spa/dist; the run
    # scripts keep the API's vapid.json in the repository root while they run; and each starts a
    # worker on the one Valkey service, where a worker would take another stack's jobs.
    image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
    when: *browser_when
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: tester
      DB_PASS: ci-throwaway
      DB_NAME: template_test
      KV_HOSTNAME: valkey
      KV_PORT: "6379"
      KV_PASSWORD: ci-throwaway
    commands:
      # npm's newest `deno` package lags the binary, so take the pinned release itself.
      - |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /tmp/deno.zip https://github.com/denoland/deno/releases/download/v2.9.7/deno-x86_64-unknown-linux-gnu.zip
          echo "c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490  /tmp/deno.zip" | sha256sum -c -
          apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip nginx
          unzip -q -o /tmp/deno.zip -d /usr/local/bin
          chmod +x /usr/local/bin/deno
      - deno --version
      - deno install --frozen
      - deno task build
      # Postgres first runs a temporary server that listens on a unix socket only, so a TCP
      # connection means the real one is up (docs/handoff.md, trap 3). Valkey has no such phase.
      - |
          deno eval '
          for (const [hostname, port] of [["postgres", 5432], ["valkey", 6379]]) {
            for (let i = 0; ; i++) {
              try {
                (await Deno.connect({ hostname, port })).close()
                break
              } catch {
                if (i >= 120) {
                  console.error(`$${hostname} did not accept connections within 60 s`)
                  Deno.exit(1)
                }
                await new Promise((resolve) => setTimeout(resolve, 500))
              }
            }
          }
          '
      - e2e/mpa/run.sh
      - SPA_SERVER=nginx e2e/spa/run.sh
    depends_on: [check]

  lighthouse:
    # The public website's Lighthouse budget ("Design gate" in the global agent rules). In
    # Lighthouse mobile, every page apps/mpa/lighthouse/lighthouserc.json lists scores at least 95
    # for performance and 100 for accessibility, best practices and SEO, the median of three runs.
    # apps/mpa/lighthouse/run.sh serves the built MPA behind nginx with gzip, as the CDN serves it
    # in production.
    # A stage of its own, after every step of the stage before and before the e2e steps, because
    # lab performance falls when other work shares the CPU: beside `integration`, the home page
    # scored 0.74 to 0.97 on code that scores 0.99 on an idle machine. It builds the MPA itself, so
    # it measures no leftover of an earlier step.
    # A pull request measures only the pages in apps/mpa/lighthouse/quick.ts, one run each
    # (`LIGHTHOUSE_PAGES=quick`, #876), against the same scores: 1.3 minutes in its first run
    # (#877). A push to `main` and a tag measure every page three times, which took a median of
    # 13.4 minutes. The light run is on trial until 2026-11-15: if a speed regression reaches
    # `main` and stays there more than a day, the full run goes back on pull requests.
    # A pull request runs it only when it changes a file the built website comes from (#821): the
    # MPA, what its module graph imports (libs/ui, libs/domain, four libs/server members, the
    # catalogs, the guides docs-list.ts publishes), the two API files of its stand-in blog API, and
    # the manifests, the lockfile and this file. A push to `main` and a tag always run it. Woodpecker
    # applies `path` to pull requests and pushes only, and runs the step when the forge lists no
    # changed file.
    image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
    when:
      - event: pull_request
        path:
          - apps/mpa/**
          - libs/ui/**
          - libs/domain/**
          - libs/server/blog/**
          - libs/server/jobs/**
          - libs/server/mail/**
          - libs/server/subscribers/**
          - apps/api/routes/blog.ts
          - apps/api/services/error-response.ts
          - i18n/**
          - docs/*.md
          - deno.json
          - deno.jsonc
          - deno.lock
          - package.json
          - .woodpecker/ci.yml
      - event: push
        branch: main
      - event: tag
    commands:
      # npm's newest `deno` package lags the binary, so take the pinned release itself.
      - |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /tmp/deno.zip https://github.com/denoland/deno/releases/download/v2.9.7/deno-x86_64-unknown-linux-gnu.zip
          echo "c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490  /tmp/deno.zip" | sha256sum -c -
          apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip nginx
          unzip -q -o /tmp/deno.zip -d /usr/local/bin
          chmod +x /usr/local/bin/deno
      - deno --version
      - deno install --frozen
      - deno task mpa:build
      # The commands share one shell, so the variable reaches the next one.
      - if [ "$${CI_PIPELINE_EVENT}" = pull_request ]; then export LIGHTHOUSE_PAGES=quick; fi
      - deno task lighthouse
    # The four after `check` are optional: a pull request that changes only Markdown skips them,
    # and Lighthouse still runs, after `check` and alone, when a changed guide is part of the
    # website.
    depends_on:
      - check
      - name: integration
        optional: true
      - name: backup-restore
        optional: true
      - name: alert-rules
        optional: true
      - name: browser
        optional: true

  e2e-smoke:
    # The product's browser tests a pull request must pass: the smoke set, `SMOKE_SPECS` in
    # infra/scripts/e2e-local-plan.ts (sign-in, the profile, notes, groups). The script is the one
    # `deno task e2e:local` runs on a developer's machine. `E2E_SERVICES=environment` makes it use
    # the Postgres and Valkey services below instead of starting containers, in a database of its
    # own (`template_e2e_app`); it waits for both itself. It starts the API, the worker, the Vite
    # dev server and a proxy that serves them at http://app.localhost:<port>. A tag runs the set
    # too, because release.yml waits for this workflow. A pull request that changes only the Markdown
    # in `markdown_only` at the top skips it: the smoke set opens no guide.
    image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
    when:
      - event: pull_request
        path:
          exclude: *markdown_only
      - event: tag
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: tester
      DB_PASS: ci-throwaway
      DB_NAME: template_test
      KV_HOSTNAME: valkey
      KV_PORT: "6379"
      KV_PASSWORD: ci-throwaway
      E2E_SERVICES: environment
    commands:
      # npm's newest `deno` package lags the binary, so take the pinned release itself.
      - |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /tmp/deno.zip https://github.com/denoland/deno/releases/download/v2.9.7/deno-x86_64-unknown-linux-gnu.zip
          echo "c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490  /tmp/deno.zip" | sha256sum -c -
          apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip
          unzip -q -o /tmp/deno.zip -d /usr/local/bin
          chmod +x /usr/local/bin/deno
      - deno --version
      # Chromium resolves *.localhost itself. The requests a spec makes outside the browser ask the
      # system resolver, which in this container does not know the name.
      - echo "127.0.0.1 app.localhost" >> /etc/hosts
      # Playwright stops after three failed tests. When sign-in itself is broken every test fails,
      # each after 30 s, and the step would otherwise run into the script's limit of 25 minutes.
      - deno task e2e:local --smoke --max-failures=3
    # After `browser`: the run scripts keep the API's vapid.json in the shared checkout while they
    # run, and each starts a worker on the one Valkey service, where a worker would take another
    # stack's jobs. After `lighthouse`, which measures alone, when it runs: a pull request that
    # cannot change the website skips it, and Woodpecker drops an optional dependency on a skipped
    # step instead of failing the pipeline over it.
    depends_on:
      - name: browser
        optional: true
      - name: lighthouse
        optional: true

  e2e-full:
    # Every browser test of the product (`e2e/*.e2e.ts`), after a merge: only a push to `main`
    # runs it, so it never stands between a pull request and its merge, nor between a tag and its
    # images. A red run here is the sign that a merge broke a screen the smoke set does not open.
    # The specs that start the app with no network need the built SPA behind nginx; a step has no
    # container tool, so `E2E_BUILT=nginx` installs the build into this container's own nginx, as
    # e2e/spa/run.sh does.
    image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
    when:
      - event: push
        branch: main
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: tester
      DB_PASS: ci-throwaway
      DB_NAME: template_test
      KV_HOSTNAME: valkey
      KV_PORT: "6379"
      KV_PASSWORD: ci-throwaway
      E2E_SERVICES: environment
      E2E_BUILT: nginx
      # The deadline of one Playwright pass, in seconds. The whole suite runs on one Playwright
      # worker and took 20 to 23 minutes of the script's default 25, so a slow run, or one failed
      # test with its retries, ran out of time. This step starts 22 to 26 minutes in, and the
      # offline pass after this one takes about 2, so a run to this deadline ends at about minute 60
      # to 64: Woodpecker's 60-minute limit killed pipelines 1537 and 1544 before the script's own
      # timeout message. The repository's Woodpecker timeout, set on the CI server rather than in
      # this file, is therefore 75 minutes (#751).
      E2E_LOCAL_TIMEOUT: "2100"
    commands:
      # npm's newest `deno` package lags the binary, so take the pinned release itself.
      - |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /tmp/deno.zip https://github.com/denoland/deno/releases/download/v2.9.7/deno-x86_64-unknown-linux-gnu.zip
          echo "c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490  /tmp/deno.zip" | sha256sum -c -
          apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip
          unzip -q -o /tmp/deno.zip -d /usr/local/bin
          chmod +x /usr/local/bin/deno
      - deno --version
      - apt-get install -y -qq --no-install-recommends nginx
      - echo "127.0.0.1 app.localhost" >> /etc/hosts
      # Stops after ten failed tests in a pass, for the same reason as in e2e-smoke.
      - deno task e2e:local --max-failures=10
    # As e2e-smoke. A push to `main` always runs lighthouse.
    depends_on:
      - browser
      - name: lighthouse
        optional: true

  runtimes:
    # Starts the API, the worker and the website on Deno, Node and Bun, and checks each answers
    # (tests/runtimes/smoke.sh, #623). The Node image gets Deno and Bun from their release zips,
    # checked against their SHA-256. The script works in its own copy of the checkout, so it runs
    # beside `browser` and `lighthouse` without sharing their builds or vapid.json.
    image: docker.io/library/node:26.13.0-bookworm@sha256:fa52d1669505e29b58c042875b1d65c229e0787a3610fd52869b22b68e480853
    when: *stack_when
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: tester
      DB_PASS: ci-throwaway
      DB_NAME: template_test
      KV_HOSTNAME: valkey
      KV_PORT: "6379"
      KV_PASSWORD: ci-throwaway
    commands:
      - |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /tmp/deno.zip https://github.com/denoland/deno/releases/download/v2.9.7/deno-x86_64-unknown-linux-gnu.zip
          echo "c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490  /tmp/deno.zip" | sha256sum -c -
          unzip -q -o /tmp/deno.zip -d /usr/local/bin
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /tmp/bun.zip https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip
          echo "bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c  /tmp/bun.zip" | sha256sum -c -
          unzip -q -o -j /tmp/bun.zip bun-linux-x64/bun -d /usr/local/bin
          chmod +x /usr/local/bin/deno /usr/local/bin/bun
      - deno --version && node --version && bun --version
      # smoke.sh copies the checkout with git, which refuses a repository another user owns.
      - git config --global --add safe.directory "$$PWD"
      - |
          deno eval '
          for (const [hostname, port] of [["postgres", 5432], ["valkey", 6379]]) {
            for (let i = 0; ; i++) {
              try {
                (await Deno.connect({ hostname, port })).close()
                break
              } catch {
                if (i >= 120) {
                  console.error(`$${hostname} did not accept connections within 60 s`)
                  Deno.exit(1)
                }
                await new Promise((resolve) => setTimeout(resolve, 500))
              }
            }
          }
          '
      - tests/runtimes/smoke.sh
    depends_on: [check]

  image-node:
    # Builds the Node and Bun images of the API (apps/api/dockerfile.node, apps/api/dockerfile.bun,
    # #748) and of the website (apps/mpa/dockerfile.node, apps/mpa/dockerfile.bun, #623), so a pull
    # request that breaks a bundle or a Dockerfile fails here, not at the release. Kaniko builds
    # inside an ordinary container, with no Docker daemon, no volume and no secret, and pushes
    # nothing (`--no-push`), as in release.yml. All four are self-contained, so no base image has
    # to be published first. One step each: kaniko builds in its own root
    # filesystem, so two builds in one container would share it.
    # Base images come through Google's public Docker Hub mirror (`--registry-mirror`), because
    # anonymous pulls from Docker Hub hit its rate limit and failed all four steps (#923). The
    # mirror needs no login; an image it lacks is pulled from Docker Hub as before.
    # A pull request builds them only when it changes a file that goes into an image (#876): the
    # build context that .dockerignore lets in (each Dockerfile copies it whole), the Dockerfiles,
    # and this file. A push to `main` and a tag always build them.
    image: woodpeckerci/plugin-kaniko:2.3.3@sha256:d6ecc0f37561503eeacd8f2189068c5a13c531f5629cf2ce2de0ac144824c9f4
    when: *image_when
    commands:
      - executor --context "$$PWD" --dockerfile apps/api/dockerfile.node --no-push
        --registry-mirror mirror.gcr.io
    depends_on: []

  image-bun:
    # See image-node.
    image: woodpeckerci/plugin-kaniko:2.3.3@sha256:d6ecc0f37561503eeacd8f2189068c5a13c531f5629cf2ce2de0ac144824c9f4
    when: *image_when
    commands:
      - executor --context "$$PWD" --dockerfile apps/api/dockerfile.bun --no-push
        --registry-mirror mirror.gcr.io
    depends_on: []

  image-mpa-node:
    # See image-node.
    image: woodpeckerci/plugin-kaniko:2.3.3@sha256:d6ecc0f37561503eeacd8f2189068c5a13c531f5629cf2ce2de0ac144824c9f4
    when: *image_when
    commands:
      - executor --context "$$PWD" --dockerfile apps/mpa/dockerfile.node --no-push
        --registry-mirror mirror.gcr.io
    depends_on: []

  image-mpa-bun:
    # See image-node.
    image: woodpeckerci/plugin-kaniko:2.3.3@sha256:d6ecc0f37561503eeacd8f2189068c5a13c531f5629cf2ce2de0ac144824c9f4
    when: *image_when
    commands:
      - executor --context "$$PWD" --dockerfile apps/mpa/dockerfile.bun --no-push
        --registry-mirror mirror.gcr.io
    depends_on: []

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: tester
      POSTGRES_PASSWORD: ci-throwaway
      POSTGRES_DB: template_test
    # Durability off: the data is thrown away with the run, and the agent host's one disk, shared
    # with every repository's pipelines, was saturated by this service's flushes. No step relies
    # on crash safety or the WAL: backup-restore uses pg_dump and pg_restore. The entrypoint
    # still creates the user and database from the variables above, and drops to the postgres
    # user itself.
    commands:
      - docker-entrypoint.sh postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
  valkey:
    image: valkey/valkey:8.1
    commands:
      - valkey-server --requirepass ci-throwaway
