<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-labelledby="title desc">
  <title id="title">Seed architecture: apps, services and shared code</title>
  <desc id="desc">Clients: apps/spa, the product, a Preact and Vite PWA with an IndexedDB offline copy that pulls what changed since its cursor; apps/admin, the operator area on its own host; apps/mpa, the public website on Fresh, rendered on the server. All three call apps/api, the SPA over REST, the call route and the WebSocket, the admin app over REST, the MPA over REST for the blog, contact links, the catalog and the newsletter. Servers: apps/api on Hono (auth, CQRS dispatch, REST, the call route, the WebSocket) and apps/worker, which runs the outbox jobs. Data: Postgres 18 behind PgBouncer is the source of truth, Valkey holds rate limits, sign-in flows and the cache, and Garage stores files with the files profile. Docker Compose also runs Traefik and, with the monitoring profile, VictoriaMetrics, VictoriaLogs and Grafana. Shared code: libs/domain, libs/server, libs/ui, libs/platform and the @spy4x packages on JSR.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .t { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; }
    .h { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; font-weight: 600; }
    .title { font-size: 20px; font-weight: 600; }
    .m { fill: #59636e; }
    .tier { fill: #59636e; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; }
    .box { fill: #f6f8fa; stroke-width: 1.5; }
    .app { stroke: #0969da; }
    .data { stroke: #1a7f37; }
    .lib { stroke: #8250df; }
    .ops { stroke: #d0d7de; }
    .line { stroke: #59636e; stroke-width: 1.5; fill: none; }
    .head { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .t { fill: #e6edf3; }
      .m, .tier { fill: #9198a1; }
      .box { fill: #161b22; }
      .app { stroke: #4493f8; }
      .data { stroke: #3fb950; }
      .lib { stroke: #ab7df8; }
      .ops { stroke: #30363d; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="959" height="699" rx="12"/>

  <text class="t title" x="40" y="44">Seed: what runs</text>

  <!-- Clients -->
  <text class="t tier" x="40" y="82">CLIENTS</text>
  <rect class="box app" x="40" y="92" width="280" height="96" rx="8"/>
  <text class="t h" x="56" y="118">apps/spa</text>
  <text class="t" x="56" y="140">the product: Preact + Vite PWA</text>
  <text class="t m" x="56" y="160">IndexedDB offline copy,</text>
  <text class="t m" x="56" y="178">pulls changes since its cursor</text>

  <rect class="box app" x="340" y="92" width="280" height="96" rx="8"/>
  <text class="t h" x="356" y="118">apps/admin</text>
  <text class="t" x="356" y="140">the operator area</text>
  <text class="t m" x="356" y="160">on its own host, one module</text>
  <text class="t m" x="356" y="178">per feature</text>

  <rect class="box app" x="640" y="92" width="280" height="96" rx="8"/>
  <text class="t h" x="656" y="118">apps/mpa</text>
  <text class="t" x="656" y="140">the public website: Fresh</text>
  <text class="t m" x="656" y="160">rendered on the server,</text>
  <text class="t m" x="656" y="178">works without JavaScript</text>

  <!-- Client to server edges -->
  <line class="line" x1="180" y1="188" x2="240" y2="258" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="t m" x="56" y="226">REST, call route,</text>
  <text class="t m" x="56" y="242">WebSocket</text>
  <line class="line" x1="480" y1="188" x2="400" y2="258" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="t m" x="452" y="232">REST</text>
  <line class="line" x1="780" y1="188" x2="450" y2="270" marker-end="url(#arrow)"/>
  <text class="t m" x="664" y="226">REST: blog, catalog,</text>
  <text class="t m" x="664" y="242">newsletter</text>

  <!-- Servers -->
  <text class="t tier" x="40" y="282">SERVERS</text>
  <rect class="box app" x="140" y="262" width="320" height="86" rx="8"/>
  <text class="t h" x="156" y="288">apps/api</text>
  <text class="t" x="156" y="310">Hono: REST, call route, WebSocket</text>
  <text class="t m" x="156" y="330">auth, CQRS dispatch, operation budget</text>

  <rect class="box app" x="600" y="262" width="320" height="86" rx="8"/>
  <text class="t h" x="616" y="288">apps/worker</text>
  <text class="t" x="616" y="310">runs the outbox jobs</text>
  <text class="t m" x="616" y="330">mail, Telegram, exports, nightly cleanup</text>

  <!-- Server to data edges -->
  <line class="line" x1="190" y1="348" x2="130" y2="418" marker-end="url(#arrow)"/>
  <line class="line" x1="340" y1="348" x2="380" y2="418" marker-end="url(#arrow)"/>
  <line class="line" x1="440" y1="348" x2="690" y2="418" marker-end="url(#arrow)"/>
  <line class="line" x1="700" y1="348" x2="480" y2="418" marker-end="url(#arrow)"/>
  <line class="line" x1="820" y1="348" x2="780" y2="418" marker-end="url(#arrow)"/>

  <!-- Data -->
  <text class="t tier" x="40" y="412">DATA</text>
  <rect class="box data" x="40" y="422" width="200" height="86" rx="8"/>
  <text class="t h" x="56" y="448">Valkey</text>
  <text class="t m" x="56" y="470">rate limits, sign-in flows,</text>
  <text class="t m" x="56" y="488">API cache</text>

  <rect class="box data" x="260" y="422" width="360" height="86" rx="8"/>
  <text class="t h" x="276" y="448">Postgres 18, behind PgBouncer</text>
  <text class="t m" x="276" y="470">the source of truth: records,</text>
  <text class="t m" x="276" y="488">outbox_events, the change log</text>

  <rect class="box data" x="640" y="422" width="280" height="86" rx="8"/>
  <text class="t h" x="656" y="448">Garage</text>
  <text class="t m" x="656" y="470">S3 store for uploaded files</text>
  <text class="t m" x="656" y="488">files profile</text>

  <!-- Shared code -->
  <text class="t tier" x="40" y="542">SHARED CODE</text>
  <rect class="box lib" x="40" y="552" width="160" height="76" rx="8"/>
  <text class="t h" x="56" y="578">libs/domain</text>
  <text class="t m" x="56" y="600">rules, commands</text>

  <rect class="box lib" x="214" y="552" width="160" height="76" rx="8"/>
  <text class="t h" x="230" y="578">libs/server</text>
  <text class="t m" x="230" y="600">repositories, jobs</text>

  <rect class="box lib" x="388" y="552" width="160" height="76" rx="8"/>
  <text class="t h" x="404" y="578">libs/ui</text>
  <text class="t m" x="404" y="600">product screens</text>

  <rect class="box lib" x="562" y="552" width="160" height="76" rx="8"/>
  <text class="t h" x="578" y="578">libs/platform</text>
  <text class="t m" x="578" y="600">i18n, shortcuts</text>

  <rect class="box lib" x="736" y="552" width="184" height="76" rx="8"/>
  <text class="t h" x="752" y="578">@spy4x/* on JSR</text>
  <text class="t m" x="752" y="600">CQRS, auth, outbox, UI</text>

  <text class="t m" x="40" y="664">Docker Compose also runs Traefik and, with the monitoring profile, VictoriaMetrics, VictoriaLogs and Grafana.</text>
  <text class="t m" x="40" y="684">Every app runs on Deno.</text>
</svg>
